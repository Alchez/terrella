# Terrella serving block. Two server blocks, one shared rule set (the include).
# Nothing here is deployed anywhere — see ../README.md.
#
# :80 is the ORIGIN shape: plain HTTP, what a server speaks when something in
# front of it terminates TLS. Kept because that is the common self-hosting
# arrangement, and because the cache classes are easier to inspect over HTTP.
#
# :443 reproduces what a CLIENT experiences — TLS + HTTP/2 multiplexing, which
# is what makes concurrency behave the way it does in production. Self-signed
# cert from make-local-cert.sh.

server {
    listen 80;
    server_name _;
    include /etc/nginx/includes/terrella-locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    include /etc/nginx/includes/terrella-locations.conf;
}
