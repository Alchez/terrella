# Terrella serving block. Two server blocks, one shared rule set (the include).
#
# :80 is the PROD shape: on rohome the container sits behind the Pangolin
# tunnel, and TLS + HTTP/2 terminate at the VPS (Traefik) — origin nginx
# speaks plain HTTP into the WireGuard tunnel.
#
# :443 is LOCAL-SIM ONLY: it reproduces what the client experiences in prod
# (TLS + HTTP/2 multiplexing) without the VPS in the path. Self-signed cert
# from make-local-cert.sh; never deployed anywhere.

server {
    listen 80;
    server_name _;
    include /etc/nginx/includes/terrella-locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    include /etc/nginx/includes/terrella-locations.conf;
}
