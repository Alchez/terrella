# Shared serving rules for Terrella — included by both server blocks in
# terrella.conf (:80 prod shape behind the Pangolin tunnel, :443 local-sim TLS).
# One include so the two blocks cannot drift.

# On-the-fly compression, scoped to text-like payloads only: tile PNGs, hero
# WebPs and the PMTiles archive are already-compressed binary — recompressing
# wastes CPU for ~0 bytes. countries.geojson is what this exists for
# (9.2 MB -> 2.6 MB). Binary types are simply absent from gzip_types.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/geo+json application/json text/css text/javascript
           application/javascript image/svg+xml;

# Serve file contents straight from the kernel page cache, no userspace copy.
sendfile on;
tcp_nopush on;

# The static site (astro build output), mounted read-only by docker-compose.
root /site;

# Hashed build assets: the filename embeds a content hash, so the URL changes
# whenever the bytes do — cache forever, never revalidate.
location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Polar cap textures (built into dist/caps): not content-hashed, rebuilt rarely.
# A week of cache, then ETag revalidation (nginx emits ETags on static files).
location /caps/ {
    add_header Cache-Control "public, max-age=604800";
}

# Asset stores — served straight off the data directories, same URLs as the
# dev middleware in astro.config.ts, but with nginx's native file handling.
location /heroes/ {
    alias /stores/heroes/;
    add_header Cache-Control "public, max-age=604800";
}

location /borders/ {
    alias /stores/borders/;
    # mime.types has no entry for .geojson; everything in this store is GeoJSON.
    default_type application/geo+json;
    add_header Cache-Control "public, max-age=604800";
}

# Relief tiles are the one thing this sim CANNOT serve, and it says so out loud rather
# than letting the globe render an unexplained blank sphere.
#
# The site asks for /tiles/{z}/{x}/{y}.png — one PNG per request, ranged out of the 16 GB
# PMTiles archive by a tile server. nginx used to serve the archive itself over Range and
# let the browser do that ranging, which is precisely the shape that cannot survive a CDN
# (→ HISTORY § the deploy target moves to R2), so the client no longer asks for it. Ranging
# now happens in a tile server: the Astro dev middleware locally, a Worker over R2 in
# production. nginx cannot be either. Everything else here — the shell, the cache classes,
# the geojson gzip, the hero and border stores — is still a faithful prod twin.
location /tiles/ {
    # Empty types block, so the .png extension does not win and label this message as an
    # image — a diagnostic nobody can read is not a diagnostic.
    types { }
    default_type text/plain;
    return 501 "The nginx sim serves the site shell and the asset stores, not relief tiles.\nRun `astro dev` for tiles locally, or `wrangler dev` for the production tile Worker.\n";
}

# Pages: always revalidate, so a fresh HTML entry picks up new hashed asset
# URLs the moment a deploy lands. (no-cache = "store, but ask first", not
# "don't store" — that would be no-store.)
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
}
