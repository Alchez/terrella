# Local prod-sim of the Terrella serving block: the static site plus the asset stores,
# with production's cache classes and compression, offline and without a Cloudflare
# account. It is not a deployment template — the live site runs on a CDN, serving the shell and
# the assets from object storage with an edge worker for tiles — and this sim does not serve
# relief tiles at all; see the /tiles/ block in nginx/terrella-locations.conf for why.
#
# Run from deploy/:
#   ./make-local-cert.sh                       # once, self-signed cert for :443
#   docker compose --env-file ../web/.env up -d
#
# Store paths come from web/.env — the same single source of truth the astro
# dev middleware uses; compose interpolates ${...} below from that file.
#
#   http://localhost:8080  — plain HTTP (the origin shape, TLS terminated upstream)
#   https://localhost:8443 — TLS + HTTP/2 (what a client actually experiences)

services:
  web:
    image: nginx:1.31-alpine
    container_name: terrella-sim
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../web/dist:/site:ro
      - ./nginx/terrella.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/terrella-locations.conf:/etc/nginx/includes/terrella-locations.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ${HERO_STORE}:/stores/heroes:ro
      - ${BORDERS_STORE}:/stores/borders:ro
