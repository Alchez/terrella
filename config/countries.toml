# Per-country render configuration — the single committed source of truth for
# which countries get heroes, their frames, and their resolution/fusion knobs.
# Read by pipeline/country_config.py (stdlib tomllib); the batch runner will
# consume the same resolver.
#
# Scope rule: a Natural Earth admin-0 row is in scope iff ADMIN == SOVEREIGNT
# (sovereign states under NE's de-facto worldview), minus [scope].exclude,
# plus [scope].include (curated dependent territories, listed by ADMIN name).
#
# Slug rule: ADMIN lowercased with non-alphanumerics stripped
# ("Sri Lanka" -> "srilanka"). The slug names the work dir (data/work/<slug>)
# and the per-country table below. A table may carry `admin = "..."` to bind a
# hand-picked slug to its NE ADMIN name; without it the rule must resolve.
#
# Per-country keys (all optional):
#   admin          NE ADMIN name, only when the slug rule can't derive it
#   frame          [W, S, E, N] lon/lat — overrides the computed padded bbox
#   hero_long_edge px — overrides [defaults].hero_long_edge
#   fusion         "1s" | "3s" — overrides the automatic choice
#   status         "antimeridian" — batch must skip loudly
#   sky_view_strength  hero AO burn strength (0..1) — overrides [defaults]
#   resolution_floor_m hero heightfield detail floor (m) — overrides [defaults];
#                      set 0 to exempt a country from the floor
#   notes          free text: why the override exists
#
# Frame pins are a separate mechanism: a committed config/frames/<slug>.json
# is copied verbatim into data/work/<slug>/render/ (country_config --emit-pin)
# and render_prep never overwrites an existing frame.json.

[defaults]
pad_pct = 5.0          # frame padding, % of the larger bbox span
hero_long_edge = 7680  # hero render long edge, px (8K-class)
warp_long_edge = 8192  # render_prep --width target for the warped grid
fusion = "auto"        # 1" iff 3" source pixels across the frame < warp width
sky_view_strength = 0.2   # hero AO burn strength (batch.py's sky_view stage), 0..1
resolution_floor_m = 60.0 # hero heightfield detail floor (m); render_prep box-lowpasses
                          # it only where the frame upsampled >~5x past it (tiny countries)

[scope]
# Strict-selector rows that are not countries to render:
exclude = [
    "Antarctica",                      # deferred: special-case hero (polar projection, no WorldCover)
    "Bir Tawil",                       # terra nullius wedge (Egypt/Sudan), not a country
    "Spratly Islands",                 # disputed reefs, no landmass at 30 m
    "Scarborough Reef",                # disputed reef, no landmass at 30 m
    "Bajo Nuevo Bank (Petrel Is.)",    # uninhabited disputed bank
    "Serranilla Bank",                 # uninhabited disputed bank
    "Cyprus No Mans Area",             # UN buffer strip, not a country
    "Brazilian Island",                # disputed Uruguay-river islet, data artifact
    "Southern Patagonian Ice Field",   # undelimited Argentina/Chile section
]
# Curated dependent territories that get their own hero:
include = [
    "Greenland",           # Denmark
    "Faroe Islands",       # Denmark
    "New Caledonia",       # France
    "French Polynesia",    # France
    "Puerto Rico",         # United States
]

# ---- sky_view (hero AO) strength overrides. [defaults].sky_view_strength is
# ---- 0.2 (a moderate AO — 0.38 read too strong on most terrain). Two deviations:
# ----   0.0   volcanic islands, fine dendritic drainage — any AO blackens every
# ----         micro-valley into a "pinecone"; raw Cycles relief is enough.
# ----   0.38  flat countries — the original reason sky_view exists (Paraguay/
# ----         Qatar looked "basic"): subtle relief needs
# ----         the stronger burn to read. The flat set is pinned below.
# ---- (Alpine microstates Andorra/Liechtenstein/Monaco want 0.2 = the default,
# ---- ladder-confirmed, so they carry no override. Monaco also needs a resolution
# ---- floor at the freeze-lift — 14x over-upsampled, source striping.)

[countries.saintlucia]
sky_view_strength = 0.0
notes = "volcanic fine drainage: any AO tendrils (pinecone); raw relief is enough"

[countries.dominica]
sky_view_strength = 0.0
notes = "volcanic fine drainage: any AO tendrils (pinecone); raw relief is enough"

[countries.grenada]
sky_view_strength = 0.0
notes = "volcanic fine drainage: any AO tendrils (pinecone); raw relief is enough"

[countries.saintvincentandthegrenadines]
sky_view_strength = 0.0
notes = "volcanic fine drainage: any AO tendrils (pinecone); raw relief is enough"

[countries.saintkittsandnevis]
sky_view_strength = 0.0
notes = "volcanic fine drainage: any AO tendrils (pinecone); raw relief is enough"

[countries.sotomandprincipe]
sky_view_strength = 0.0
notes = "volcanic fine drainage: any AO tendrils (pinecone); raw relief is enough"

[countries.comoros]
sky_view_strength = 0.0
notes = "volcanic fine drainage: any AO tendrils (pinecone); raw relief is enough"

[countries.qatar]
sky_view_strength = 0.38
notes = "flat: subtle relief needs the stronger burn to read (the original sky_view case)"

[countries.paraguay]
sky_view_strength = 0.38
notes = "flat: subtle relief needs the stronger burn to read (the original sky_view case)"

# ---- resolution floor (hero heightfield anti-striping). [defaults].resolution_floor_m
# ---- is 60 m: render_prep box-lowpasses the heightfield ONLY where the frame
# ---- upsampled far enough past the 30 m DEM that the box kernel reaches >=10 px
# ---- (xres <= 6 m/px, i.e. >5x source). That auto-selects the tiny countries whose
# ---- raw relief "shreds" from GLO-30 along-track striping — vatican, monaco, nauru,
# ---- sanmarino, liechtenstein, andorra, barbados, malta; every larger country is a
# ---- no-op (kernel < 10 px). Unlike sky_view (morphological -> a hand list), striping
# ---- severity is purely geometric, so the threshold selects the set and no per-country
# ---- entry is needed to opt IN. Overrides only tune the edge: set resolution_floor_m
# ---- = 0.0 to exempt a borderline alpine case — andorra is exempted below.

[countries.andorra]
resolution_floor_m = 0.0
notes = "alpine: real relief masks the mild striping, and the 60 m floor softens genuine fine ridge detail more than it helps (pilot A/B 2026-07-24)"

# ---- frame overrides: far-flung territories that explode the whole-geometry
# ---- bbox (main landmass <= ~25% of a bbox axis). Values = union bbox of the
# ---- mainland parts + the standard 5% pad, same rounding as frame_country.

[countries.france]
frame = [-5.9, 40.6, 10.3, 51.9]
notes = "Metropole incl. Corsica; whole bbox is 118x72 deg (reaches French Guiana, Antilles, Mayotte, Reunion). New Caledonia and French Polynesia are separate heroes."

[countries.netherlands]
frame = [3.1, 50.5, 7.4, 53.8]
notes = "European Netherlands; whole bbox reaches the Caribbean municipalities (Bonaire, Saba, Sint Eustatius)."

[countries.norway]
frame = [3.3, 56.6, 32.4, 72.5]
notes = "Mainland only; whole bbox spans Bouvet Island (54S) to Svalbard (81N), 135 deg of latitude. Jan Mayen also dropped."

[countries.portugal]
frame = [-9.8, 36.7, -5.9, 42.5]
notes = "Mainland only; whole bbox reaches the Azores and Madeira (25 deg of longitude)."

[countries.chile]
frame = [-77.7, -57.9, -64.5, -15.5]
notes = "Continental Chile incl. Tierra del Fuego; drops Easter Island, Salas y Gomez, Desventuradas, Juan Fernandez (whole bbox reaches 109W)."

# ---- antimeridian countries. The whole-geometry NE bbox spans ~(-180..180),
# ---- but a cos-lat-area part audit (2026-07-09) shows the land concentrates on
# ---- ONE side of 180 for four of five, so a non-crossing mainland/main-island
# ---- frame override captures it (the far-flung mechanism above) with no
# ---- wrap-math. Only Kiribati is genuinely split, and is deferred.

[countries.russia]
frame = [18.5, 40.0, 180.0, 83.0]
notes = "Mainland 19.6-180E holds 99.3% of the land; the Chukotka/Wrangel/Diomede sliver past 180 (0.7%) is dropped. Frame hand-tightened (a 5% pad on a 168deg span adds ~8deg of empty arctic); an extreme coarse overview, but non-crossing."

[countries.unitedstatesofamerica]
frame = [-127.6, 22.2, -64.0, 52.3]
notes = "CONUS (82.9% of land); Alaska, Hawaii, and the Aleutian tail past 180 are dropped (same mainland-only policy as France). Could become separate territory heroes later."

[countries.newzealand]
frame = [164.9, -53.6, 179.8, -33.2]
notes = "North + South Islands (99.7% of land, 166-179E, does not cross 180); the Chatham Islands (0.3%, past 180) are dropped."

[countries.fiji]
frame = [174.1, -22.2, 180.0, -12.0]
notes = "Viti Levu + Vanua Levu and the western group (95.8% of land, 174.6-180E); the Lau group past 180 (4.2%) is dropped."

[countries.kiribati]
status = "antimeridian"
notes = "DEFERRED special-case (2026-07-09): genuinely split across 180 - Gilberts 32% at 169-177E (incl. capital Tarawa) vs Phoenix+Line 68% at 175-151W (incl. the largest atoll Kiritimati), no dominant side. No non-crossing frame represents it and a true 40deg crosser would be mostly empty ocean. Like Antarctica, no hero for now. Presentation options analysed -> FUTURE.md section 'Kiribati presentation' (viable: composited twin-panel hero, or a no-hero gallery card; ruled out: wide crosser, separate sub-heroes)."

# ---- data-coverage notes

[countries.greenland]
notes = "WorldCover stops at 82.75N; the northern tip has no snow mask. Decide fallback (treat as snow via GLO-30 WBM? plain ramp?) when Greenland's data is acquired."
