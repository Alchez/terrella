[project]
name = "terrella"
version = "0.1.0"
description = "Pipeline for ray-traced relief maps: DEM/bathymetry fusion, render prep, overlays"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "earthaccess>=0.18.0",
    "numpy>=2.5",
    "pycairo>=1.29", # vector overlay compositing (borders, hydro)
    "pyproj>=3.7", # AEA <-> lon/lat transforms outside rasterio
    "pyshp>=3.1", # Natural Earth shapefile reading
    "rasterio>=1.5", # wheels bundle GDAL; no system GDAL needed on the Python side
    "scipy>=1.18", # ndimage: spotlight distance transforms + render_prep resolution floor
]

# Dependency manifest only — the repo is scripts, not an installable library.
# The bpy scripts (scene_build, scene_dump) run under Blender's own
# bundled Python and cannot use this environment.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

# Same engine as Pylance, so `uv run pyright` reproduces the IDE's findings.
# tests/ joined `include` on 2026-07-16: it had never been checked, so typing shade.KNOBS as a
# TypedDict silently broke three test files that the pipeline-only scan could not see. An
# unchecked directory is where a "zero errors" claim quietly rots.
# THERE IS NO LONGER AN EXCLUDE. `pipeline/experiments` used to be one, on the grounds that archival
# prototypes are not maintained — and they were maintained anyway, by hand, whenever a refactor moved
# under them, with nothing checking the result. Two of them had rotted into no-ops nobody could see:
# one swept a ladder whose rungs had become identical, the other restored a default that had moved.
# An unmaintained directory inside a checked package is not cheaper than deleting it; it just moves
# the cost somewhere no gate reports.
[tool.pyright]
# `scripts` joined on the same footing as `tests` did: it holds a maintenance tool that WRITES to
# source files, so an unchecked type there is not a cosmetic risk.
include = ["pipeline", "tests", "scripts"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

# The second static gate, beside pyright and asking a different question: pyright asks whether the
# types line up, ruff asks whether the code says what it means. Both stay at ZERO — there is no
# "pre-existing finding" allowance here any more than there is for the type checker.
#
# NO `select`, deliberately. This takes ruff's own default rule set rather than a hand-written list
# of families, because the default is a CURATED SUBSET and not a union: bare `E` is 5,034 findings
# in this repo (line length alone), `PL` is 235, and a hand-written list would have to be
# re-derived at every upgrade to stay equal to it. The bargain is that `uv lock --upgrade` is where
# new rules arrive and where the gate can go red on an otherwise unrelated change — the same
# bargain already struck with pyright's `standard` mode, and a linter that never learns anything
# new is not worth running.
#
# `target-version` is inferred from `requires-python` above, so ruff targets 3.12 and cannot
# propose syntax that Blender's bundled 3.13 lacks. That is load-bearing rather than incidental:
# palette.py and the two bpy scripts are shared with an interpreter this venv never runs, and
# `scripts/check_blender_drift.sh` is the only other thing that looks.
[tool.ruff.lint]
# E402 is NOT in the default set, and it is turned on here because the repo had already asked for
# it: seven `# noqa: E402` directives were written against it. Six of them suppress nothing — they
# are leftovers from a refactor that moved the imports to the top, and RUF100 is what says so. The
# seventh, in gen_spotlight.py, is a real mid-file import with a paragraph explaining itself.
# Enabling the rule costs zero findings and is what keeps that one comment honest.
extend-select = ["E402"]

ignore = [
    # `dict(driver="GTiff", width=…)` — 40 sites, nearly all GDAL creation profiles, every one of
    # them keyword-argument form rather than an empty `dict()`. The literal rewrite is a wash at
    # best and reads worse wherever the keys line up as identifiers.
    "C408",
]

# Tests cover the pure geometry/config resolution layer (framing math, config
# validation, scope + frame resolution) — the deterministic core where a silent
# regression would render a wrong hero. Rendering/fusion/downloads are not unit
# tested (data- and GPU-bound). pythonpath="." makes `pipeline` importable.
# Native [tool.pytest] table (pytest 9.0+), not the legacy [tool.pytest.ini_options].
[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]

# Coverage is ON DEMAND (`uv run pytest --cov`, enforced in CI), not in addopts:
# a default --cov would make every single-file test run report near-zero pipeline
# coverage and trip fail_under. The floor is the CI-VISIBLE 2026-07-23 baseline
# rounded down (30.94% there — 12 data-bound tests skip on CI; local reads
# 32.45%) — it exists to make coverage ROT loud, not to chase a number; raise it
# as real coverage lands, never lower it to make a run pass.
# A 13th test skips on CI since 2026-07-28 (the `gdal raster tile` probe, which
# needs GDAL >= 3.11) and it does NOT move the baseline: measured both ways at
# 39.30%, because it drives external binaries and executes no pipeline line.
[tool.coverage.run]
source = ["pipeline"]
omit = [
    # bpy scripts run under Blender's bundled Python — unit tests can never import them
    # (their shared constants ARE covered, via tests/test_scene_build_sync.py's bpy stub)
    "pipeline/render/scene_build.py",
    "pipeline/render/scene_dump.py",
    # the pass-profiling harness: wraps live 30+ min planet passes, nothing to unit test
    "pipeline/profile/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50  # the 2026-08-14 CI-visible baseline (53.78%), floored — ratchet up, never down
