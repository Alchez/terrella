name: CI

# Fast, data-free checks on the pipeline's pure logic layer. Rendering, fusion,
# and downloads are not exercised here (GPU- and data-bound) — this guards the
# geometry/config resolver, where a silent regression renders a wrong hero.

on:
  pull_request:

jobs:
  check:
    name: pyright + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pycairo (a project dep) builds against the system cairo headers, and
      # pyright needs it installed to type-check the compose modules.
      - name: Install cairo headers
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Sync dependencies (incl. dev)
        run: uv sync

      - name: Type-check (pyright)
        run: uv run pyright pipeline/

      - name: Tests (pytest)
        run: uv run pytest -q
