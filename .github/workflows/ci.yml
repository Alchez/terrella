name: CI

# PR gate for the pure, data-free layers, in two independent jobs:
#   - check: the pipeline's geometry/config resolver (pyright + pytest). Rendering,
#     fusion, and downloads are GPU/data-bound and NOT exercised here.
#   - web:   the frontend's logic + type layer (vitest + astro check). Pure/synthetic
#     fixtures, no tiles or data needed.

on:
  pull_request:

jobs:
  check:
    name: pyright + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pycairo (a project dep) builds against the system cairo headers, and
      # pyright needs it installed to type-check the compose modules. gdal-bin
      # supplies gdalbuildvrt: tests/test_build_mosaics.py drives the real
      # build_mosaics.sh against a throwaway store (a skipif here would be a
      # drift guard that silently never runs — the exact class it exists to catch).
      #
      # But it is the OLD CLI only. noble's gdal-bin is 3.8.4, and GDAL's unified
      # `gdal` entry point (`gdal raster tile`, what the tile cut runs) arrived in
      # 3.11 — so no `gdal` binary exists here at all. That probe is skipif'd in
      # tests/test_terrain_rgb.py and runs on the 3.12 boxes that cut tiles. Do not
      # "fix" it with a PPA: it would pin CI to a third-party archive to answer a
      # question about a GDAL that never sees the command.
      - name: Install cairo headers + GDAL CLI
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config gdal-bin

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Sync dependencies (incl. dev)
        run: uv sync

      # No path argument: use [tool.pyright] include = pipeline + tests (excludes
      # experiments). Was `pyright pipeline/`, which skipped tests/ — a type error in a
      # test would pass CI while failing the local `uv run pyright`.
      - name: Type-check (pyright)
        run: uv run pyright

      # The venv is Python 3.14, but palette.py + the two bpy scripts must stay importable
      # under Blender's bundled 3.13.9. This re-checks exactly those files at 3.13 so
      # 3.14-only syntax can't leak into a Blender-shared module. File list lives in the
      # script (one source of truth for CI + local).
      - name: Blender-drift guard (pyright @ 3.13)
        run: bash scripts/check_blender_drift.sh

      # --cov enforces [tool.coverage.report] fail_under — pinned to the CI-visible
      # baseline (12 data-bound tests skip here, so CI coverage reads lower than a
      # full local run; a 13th skips on the GDAL version above and costs 0 coverage).
      # The ratchet: raise the floor as coverage lands, never lower it.
      - name: Tests + coverage ratchet (pytest --cov)
        run: uv run pytest -q --cov

  web:
    name: vitest + astro check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # pnpm before setup-node, so setup-node's `cache: pnpm` finds it. The version is NOT
      # pinned here: it comes from `packageManager` in web/package.json, so the dev box and
      # CI cannot drift (they did — CI ran 11 while local ran 10, and pnpm 11's default
      # `minimumReleaseAge` of 24h failed a lockfile that installed clean locally).
      # package_json_file is relative to the repo root, not this job's working-directory.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (astro check)
        run: pnpm check

      # The vitest `browser` project launches a real chromium; `pnpm install` fetches the
      # playwright NPM package but never its browser binaries, so without this the project
      # cannot start and the run reports `28 passed (30)` with an unhandled launch error.
      # Placed after the type-check so a type error fails before paying for the download.
      #
      # `--only-shell` is coupled to `headless: true` in web/vitest.config.ts: headless
      # chromium launches chrome-headless-shell, a separate ~100 MB artifact from the full
      # Chrome for Testing build. Flipping that flag to headed needs this narrowing dropped,
      # or CI fails with the same "Executable doesn't exist" it exists to prevent.
      - name: Install the browser vitest launches
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # A vitest project whose `include` matches nothing is absent from the run, not an error —
      # green, exit 0, files silently uncollected — and `passWithNoTests` cannot be set per
      # project. Its own step rather than part of `pnpm test`, because a guard inside the suite
      # would be dropped by the same broken glob it is meant to catch.
      - name: Every test file is collected
        run: pnpm run check:test-collection

      - name: Tests (vitest)
        run: pnpm test
